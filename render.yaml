# Render Blueprint: New > Blueprint > pick this repo. Free plan, built from the Dockerfile.
services:
  - type: web
    name: tiny-tank-mcp
    runtime: docker
    plan: free
    branch: main
    # Deploy only after every CI check on the commit passes (finding F5).
    # Replaces the deprecated autoDeploy: true, which deployed in parallel with CI.
    autoDeployTrigger: checksPass
    envVars:
      # Render asks for these at setup (sync: false). Use the service's own hostname,
      # e.g. tiny-tank-mcp.onrender.com and https://tiny-tank-mcp.onrender.com
      - key: MCP_ALLOWED_HOSTS
        sync: false
      - key: MCP_ALLOWED_ORIGINS
        sync: false

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Two versions on purpose: the pinned tool definition (SEC-01) must not depend on the runtime.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Functional and security tests (SEC-01..05)
        run: python -m pytest -v
      - name: Black-box security check against a live server
        run: |
          python -m src.server 2> server.log &
          for i in $(seq 1 20); do python -c "import socket; socket.create_connection(('127.0.0.1', 8000), 1)" && break; sleep 0.5; done
          python tools/smoke_test.py
          python -m tools.security_check --log-file server.log
